services:
  - type: web
    name: underright-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: DATABASE_SSL
        value: "true"

      - key: CLIENT_URLS
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRES_IN
        value: 8h

      - key: DEMO_USER_NAME
        value: Demo Underwriter

      - key: DEMO_USER_EMAIL
        sync: false

      - key: DEMO_USER_PASSWORD
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite